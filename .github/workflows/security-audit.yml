name: Security Audit

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run security audit
        run: bun audit

      - name: Run lint check
        run: bun run lint

      - name: Run format check
        run: bun run check

  dependabot-auto-merge:
    needs: security-audit
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: |
          echo "Dependabot PR detected - enabling auto-merge"
